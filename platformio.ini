; PlatformIO Project Configuration File
;
; RF.Guru MeshCore Pager
; RP2040 + RFM96W (SX1276), 1.3" OLED, one button, one buzzer, one RGB LED.
;
; The board is the schematic in docs/hardware.md: the radio hangs off SPI0 and
; the display off SPI1, because GP10/GP11 can only be spi1 and GP16/18/19 can
; only be spi0. Neither the radio's DIO0 nor DIO1 is routed to the RP2040, so
; both transmit and receive are polled - see src/radio.cpp.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = fatfs
board_build.arduino.earlephilhower.usb_manufacturer = RF.Guru
board_build.arduino.earlephilhower.usb_product = MeshCorePager
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xFF43
board_build.filesystem_size = 0.5m

; Float conversions in printf/scanf. The Arduino recipe passes these
; (framework platform.txt, compiler.c.elf.flags); PlatformIO does not, so
; without them every %f in a status line silently prints nothing.
build_flags =
	-Wl,-u,_printf_float
	-Wl,-u,_scanf_float

monitor_speed = 115200
monitor_raw = yes

lib_deps =
	jgromes/RadioLib@7.7.1
	olikraus/U8g2@^2.35.30
